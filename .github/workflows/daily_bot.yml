name: Aspirant Master Daily Automation

on:
  schedule:
    # 06:30 AM IST = 1:00 AM UTC (Morning Kickoff)
    - cron: '0 1 * * *'
    # 08:30 AM IST = 3:00 AM UTC (Daily 360° Issue Dossier)
    - cron: '0 3 * * *'
    # 01:00 PM IST = 7:30 AM UTC (Prelims & Objective Drill)
    - cron: '30 7 * * *'
    # 05:00 PM IST = 11:30 AM UTC (Daily Mains Challenge)
    - cron: '30 11 * * *'
    # 07:30 PM IST = 2:00 PM UTC (High-Yield Capsule)
    - cron: '0 14 * * *'
    # 08:30 PM IST = 3:00 PM UTC (Official Model Answer)
    - cron: '0 15 * * *'
    # 09:30 PM IST = 4:00 PM UTC (Night Revision Audit)
    - cron: '0 16 * * *'

  # Allow manual trigger from GitHub website
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Which aspirant job to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - kickoff
          - dossier
          - drill
          - mains
          - capsule
          - model-answer
          - night

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
  KAN_BOT_TOKEN: ${{ secrets.KAN_BOT_TOKEN }}
  KAN_CHANNEL_ID: ${{ secrets.KAN_CHANNEL_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  run-aspirant-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests python-telegram-bot==20.7 schedule

      - name: Create data and log directories
        run: |
          mkdir -p data logs

      - name: Determine and Run Appropriate Aspirant Job
        run: |
          # Check if manual trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ github.event.inputs.job_type }}"
            if [ "$JOB" = "all" ]; then
              python main.py test
            else
              python main.py "$JOB"
            fi
            exit 0
          fi

          # Schedule mapping (cron UTC)
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            "0 1 * * *")
              echo "Executing 06:30 AM IST Morning Kickoff..."
              python main.py kickoff
              ;;
            "0 3 * * *")
              echo "Executing 08:30 AM IST Daily 360 Dossier..."
              python main.py dossier
              ;;
            "30 7 * * *")
              echo "Executing 01:00 PM IST Prelims Drill..."
              python main.py drill
              ;;
            "30 11 * * *")
              echo "Executing 05:00 PM IST Daily Mains Challenge..."
              python main.py mains
              ;;
            "0 14 * * *")
              echo "Executing 07:30 PM IST High-Yield Capsule..."
              python main.py capsule
              ;;
            "0 15 * * *")
              echo "Executing 08:30 PM IST Official Model Answer..."
              python main.py model-answer
              ;;
            "0 16 * * *")
              echo "Executing 09:30 PM IST Night Revision Audit..."
              python main.py night
              ;;
            *)
              echo "Defaulting to full check..."
              python main.py kickoff
              ;;
          esac
