name: Aspirant Master Daily Automation

on:
  schedule:
    # 06:35 AM IST = 1:05 AM UTC (Morning Kickoff)
    - cron: '5 1 * * *'
    # 08:35 AM IST = 3:05 AM UTC (Daily 360° Issue Dossier)
    - cron: '5 3 * * *'
    # 01:05 PM IST = 7:35 AM UTC (Prelims & Objective Drill)
    - cron: '35 7 * * *'
    # 05:05 PM IST = 11:35 AM UTC (Daily Mains Challenge)
    - cron: '35 11 * * *'
    # 07:35 PM IST = 2:05 PM UTC (High-Yield Capsule)
    - cron: '5 14 * * *'
    # 08:35 PM IST = 3:05 PM UTC (Official Model Answer)
    - cron: '5 15 * * *'
    # 09:35 PM IST = 4:05 PM UTC (Night Revision Audit)
    - cron: '5 16 * * *'

  # Allow manual trigger from GitHub website
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Which aspirant job to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - auto
          - kickoff
          - dossier
          - drill
          - mains
          - capsule
          - model-answer
          - night

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
  KAN_BOT_TOKEN: ${{ secrets.KAN_BOT_TOKEN }}
  KAN_CHANNEL_ID: ${{ secrets.KAN_CHANNEL_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  run-aspirant-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests python-telegram-bot==20.7 schedule

      - name: Create data and log directories
        run: |
          mkdir -p data logs

      - name: Determine and Run Appropriate Aspirant Job
        run: |
          # If manual trigger from GitHub website
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ github.event.inputs.job_type }}"
            if [ "$JOB" = "all" ]; then
              python main.py test
            else
              python main.py "$JOB"
            fi
            exit 0
          fi

          # Scheduled trigger: automatically detect correct job based on IST time
          python main.py auto
