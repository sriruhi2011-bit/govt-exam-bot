name: Aspirant Master Daily Automation

on:
  # Triggered automatically at exact IST times by cron-job.org via API
  # Also allows manual trigger from GitHub website
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Which aspirant job to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - auto
          - kickoff
          - dossier
          - drill
          - mains
          - capsule
          - model-answer
          - night

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
  KAN_BOT_TOKEN: ${{ secrets.KAN_BOT_TOKEN }}
  KAN_CHANNEL_ID: ${{ secrets.KAN_CHANNEL_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  WHATSAPP_ENABLED: ${{ secrets.WHATSAPP_ENABLED }}
  WHATSAPP_INSTANCE_ID: ${{ secrets.WHATSAPP_INSTANCE_ID }}
  WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
  WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}

jobs:
  run-aspirant-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests python-telegram-bot==20.7 schedule

      - name: Create data and log directories
        run: |
          mkdir -p data logs

      - name: Determine and Run Appropriate Aspirant Job
        run: |
          # If manual trigger from GitHub website
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ github.event.inputs.job_type }}"
            if [ "$JOB" = "all" ]; then
              python main.py test
            else
              python main.py "$JOB"
            fi
            exit 0
          fi

          # Scheduled trigger: automatically detect correct job based on IST time
          python main.py auto
