name: Aspirant Master Daily Automation

on:
  schedule:
    # 06:30 AM IST = 01:00 UTC (Morning Kickoff)
    - cron: '0 1 * * *'
    # 08:30 AM IST = 03:00 UTC (Daily 360° Issue Dossier)
    - cron: '0 3 * * *'
    # 11:00 AM IST = 05:30 UTC (Exam Notification Scan)
    - cron: '30 5 * * *'
    # 01:00 PM IST = 07:30 UTC (Prelims Quiz Drill)
    - cron: '30 7 * * *'
    # 03:30 PM IST = 10:00 UTC (Exam Notification Scan)
    - cron: '0 10 * * *'
    # 05:15 PM IST = 11:45 UTC (Newspaper Study Material PDF Prep - Admin Approval)
    - cron: '45 11 * * *'
    # 06:35 PM IST = 13:05 UTC (Broadcast Approved PDFs to Channels)
    - cron: '5 13 * * *'
    # 09:30 PM IST = 16:00 UTC (Night Revision Audit)
    - cron: '0 16 * * *'

  # Triggered automatically at exact IST times by cron-job.org via API
  # Also allows manual trigger from GitHub website
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Which aspirant job to run'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - kickoff
          - dossier
          - drill
          - prep
          - broadcast
          - check-notifications
          - list-notifications
          - night
          - status
          - all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
  ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
  ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
  KAN_BOT_TOKEN: ${{ secrets.KAN_BOT_TOKEN }}
  KAN_CHANNEL_ID: ${{ secrets.KAN_CHANNEL_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  WHATSAPP_ENABLED: ${{ secrets.WHATSAPP_ENABLED }}
  WHATSAPP_INSTANCE_ID: ${{ secrets.WHATSAPP_INSTANCE_ID }}
  WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
  WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}

jobs:
  run-aspirant-task:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install system fonts and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk fonts-noto-extra fonts-lohit-knda

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Create data and log directories
        run: |
          mkdir -p data/pdfs data/notifications logs

      - name: Determine and Run Appropriate Aspirant Job
        run: |
          # If manual trigger from GitHub website
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ github.event.inputs.job_type }}"
            if [ "$JOB" = "all" ]; then
              python main.py test
            else
              python main.py "$JOB"
            fi
            exit 0
          fi

          # Scheduled trigger: automatically detect correct job based on IST time
          python main.py auto
